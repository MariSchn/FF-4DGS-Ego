# HOI4D-ONLY CONTROL for the mixed-training claim.
# Byte-identical to train_mix3_hoi4d_oakink2_arctic.yaml except that data_roots contains ONLY
# hoi4d. Same losses, same schedule, same from-scratch init, same sampler, same feature cache.
# WHY THIS EXISTS: the 23.6 canonical came from `jitterrob`/`winner10ep`, which differ from the
# mixed run in warm start, box-jitter augmentation, epochs AND data. Comparing the mixed model
# against it would confound four variables at once, so a change could never be attributed to
# data mixing. This control varies ONLY the data.
# clip_stride 16 MUST match the feature-cache build (cache keys are <seq>_<frame_offset>).
data:
  data_roots:
    - root: "/cluster/scratch/dmonopoli/hoi4d_train"
      name: "hoi4d"
      weight: 1.0
      feature_cache_dir: "/cluster/scratch/dmonopoli/featcache/hoi4d"
  num_frames: 16
  resolution: [224, 224]
  clip_stride: 16
  val_split: 0.02
  # 4 workers OOM-killed the 24G job when the val loader's workers stacked on the train
  # loader's; 2 halves resident dataloader RAM and the feature cache makes loading cheap anyway.
  num_workers: 2

model:
  checkpoint: "models/NeoVerse/reconstructor.ckpt"
  freeze_backbone: true
  enable_hand: true
  hand_head_type: "hamer"
  use_hand_crop: true
  hand_crop_size: 8
  enable_cam: false
  enable_pts: false
  enable_depth: false
  enable_norm: false
  enable_motion: false
  enable_gs: false
  hamer_head_kwargs:
    dim: 1024
    depth: 6
    heads: 8
    dim_head: 64
    mlp_dim: 1024
    dropout: 0.0
    crop_global_depth: 1

# Loss weights copied VERBATIM from the proven recipe (configs/exp_p4_jitterrob.yaml, the
# 23.6mm C-abs headline). The previous mix3 weights were a different, unvalidated recipe and -
# critically - omitted kp3d_abs entirely. kp3d_abs is the absolute-3D keypoint loss; our own
# causal ablation shows removing it destroys absolute placement (C_abs 725 vs C_rr 131) while
# leaving articulation intact. Training mix3cyrus without it produced exactly that signature:
# C_abs 119.9 (5x worse than 23.6) with C_rr 16.7 (unchanged). Do not diverge from these
# weights without re-running that ablation.
loss_weights:
  betas:              0.01
  global_orient:      0.01
  hand_pose:          0.01
  kp2d:               0.05
  kp3d:               0.05
  kp3d_abs:           1.0   # winner10ep value (23.6 canonical). 0.5 was the older 24.9-era
                             # setting kept in exp_p4_jitterrob; 1.0 is the one with the headline.
  transl:             1.0
  hand_depth_anchor:  0.0
  root_anchor:        0.0
  gs_l1:              0.0
  gs_lpips:           0.0

# Present in the proven recipe and previously missing here.
metric_scale:
  enable: true
  clamp: [0.1, 10.0]

training:
  lr: 1e-4
  min_lr: 1e-7
  epochs: 10
  batch_size: 16
  grad_accum_steps: 2
  log_every: 100
  val_every: 3000
  save_every: 2000
  seed: 42
  output_dir: "/cluster/scratch/dmonopoli/checkpoints/ctrl_hoi4d_only"

visualization:
  mano_model_folder: "models/MANO"
  num_vis_frames: 0

hand_crop:
  rescale_factor: 1.5

debug:
  enabled: false
  max_sequences: 5
  single_frame: false

wandb:
  enabled: true
  project: "hand-head-training"
  entity: 3DV-Project
  run_name: "CONTROL HOI4D-only (same recipe as mix3cyrus)"
  tags: ["mixed", "3dataset", "cyrus-protocol"]
  notes: "Cyrus protocol: harder data in train (OakInk2 in), H2O held out as the test set."
