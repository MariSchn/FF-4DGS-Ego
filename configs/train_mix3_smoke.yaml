# SMOKE test of the mixed-3 pipeline on Euler: few seqs/root, few steps, no wandb.
# Validates env+GPU+backbone+data_roots loading end to end before the full run.
data:
  data_roots:
    - {root: "/cluster/scratch/dmonopoli/hoi4d_train", name: "hoi4d", weight: 1.0}
    - {root: "/cluster/scratch/dmonopoli/h2o_currentproto", name: "h2o", weight: 1.0}
    - {root: "/cluster/scratch/dmonopoli/arctic_ours", name: "arctic", weight: 1.0}
  num_frames: 16
  resolution: [224, 224]
  clip_stride: 8
  val_split: 0.0
  num_workers: 2

model:
  checkpoint: "models/NeoVerse/reconstructor.ckpt"
  freeze_backbone: true
  enable_hand: true
  hand_head_type: "hamer"
  use_hand_crop: true
  hand_crop_size: 8
  enable_cam: false
  enable_pts: false
  enable_depth: false
  enable_norm: false
  enable_motion: false
  enable_gs: false
  hamer_head_kwargs:
    dim: 1024
    depth: 6
    heads: 8
    dim_head: 64
    mlp_dim: 1024
    dropout: 0.0
    crop_global_depth: 1

loss_weights:
  kp3d:          0.05
  kp2d:          0.05
  global_orient: 0.32
  hand_pose:     0.32
  betas:         0.32
  transl:        3.2
  gs_l1:         0.0
  gs_lpips:      0.0

training:
  lr: 1e-4
  min_lr: 1e-7
  epochs: 1
  batch_size: 4
  grad_accum_steps: 1
  max_steps: 15
  log_every: 2
  val_every: 100000
  save_every: 100000
  seed: 42
  output_dir: "/cluster/scratch/dmonopoli/checkpoints/mix3_smoke"

visualization:
  mano_model_folder: "models/MANO"
  num_vis_frames: 0

hand_crop:
  rescale_factor: 1.5

debug:
  enabled: true
  max_sequences: 4
  single_frame: false

wandb:
  enabled: false
  project: "hand-head-training"
  entity: 3DV-Project
  run_name: "mix3 smoke"
  tags: []
  notes: null
