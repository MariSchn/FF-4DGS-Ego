# ==================================================================
# P3-REGISTRATION-FAST: optimized hand-mesh <-> scene coupling.
# ------------------------------------------------------------------
# Trains the hand head using the dense surface-level hand-scene registration
# loss. Uses subsampled vertices (V=52 instead of 778) for 10x speedup.
# ==================================================================
data:
  data_root: "/work/courses/3dv/team25/data/hot3d_aria/preprocessed_pinhole_f609"
  num_frames: 16
  resolution: [224, 224]
  clip_stride: 8
  val_split: 0.01
  num_workers: 4
# ------------------------------------------------------------------
model:
  checkpoint: "models/NeoVerse/reconstructor.ckpt"
  warm_start_hand_head: "/work/courses/3dv/team25/checkpoints/default/hand_head_final.pt"
  freeze_backbone: true       # GS backbone frozen
  enable_scale_head: false    # use metric coupling from closed-form solve at inference
  enable_hand: true
  hand_head_type: "hamer"
  use_hand_crop: true
  hand_crop_size: 8
  enable_cam: true
  enable_pts: false
  enable_depth: false
  enable_norm: false
  enable_motion: false
  enable_gs: true             # need gs_depth for surface-level registration
  hand_to_gs_injection:
    enabled: true
    use_hand_valid_mask: true
  hamer_head_kwargs:
    dim: 1024
    depth: 6
    heads: 8
    dim_head: 64
    mlp_dim: 1024
    dropout: 0.0
    crop_global_depth: 1
# ------------------------------------------------------------------
loss_weights:
  kp3d:          0.05
  kp3d_abs:      0.05
  kp2d:          0.0    # DISABLED 2026-08-06: Aria-hardcoded (1408 px + 90deg rotation) vs unrotated res-pixel GT; see task #62
  global_orient: 0.01
  hand_pose:     0.01
  betas:         0.01
  transl:        0.1
  gs_l1:         0.0
  gs_lpips:      0.0
  hand_depth_anchor: 0.0
  scale_head:    0.0
  hand_scene_registration: 1.0  # <-- Enable registration loss
# ------------------------------------------------------------------
hand_scene_registration:
  margin: 0.03
  depth_min: 0.01
  conf_thresh: 0.0
  direction: "hand_only"        # <-- Route gradients to the hand head only
  warmup_steps: 0
# ------------------------------------------------------------------
metric_scale:
  enable: true
  clamp: [0.1, 10.0]
# ------------------------------------------------------------------
training:
  lr: 2e-5
  min_lr: 1e-7
  epochs: 2                     # Train for 2 epochs on the subset (112 steps total)
  batch_size: 4
  grad_accum_steps: 8
  use_amp: true
  log_every: 25
  val_every: 50
  val_max_batches: 12
  save_every: 50                # Save checkpoint every 50 steps
  grad_clip_norm: 5.0
  freeze_gs_head: true
  keep_last_checkpoints: 5      # Keep last 5 checkpoints to avoid space issues
  seed: 42
  output_dir: "/work/scratch/dmonopoli/checkpoints/p3_registration_fast"
# ------------------------------------------------------------------
visualization:
  mano_model_folder: "models/MANO"
  num_vis_frames: 4
# ------------------------------------------------------------------
hand_crop:
  rescale_factor: 1.5
# ------------------------------------------------------------------
debug:
  enabled: true                 # <-- Enable subset training
  max_sequences: 15             # <-- Load only 15 sequences (~1800 clips)
  single_frame: false
# ------------------------------------------------------------------
