# ==================================================================
# P3-GTDEPTH: the main-track metric-scene shot, done the way Cyrus asked.
# ------------------------------------------------------------------
# B2 falsified the frozen-backbone scene-metric claim: on the manipulated
# objects the anchored gs_depth was ~135cm off (62cm even with no anchor),
# because the hand anchor only constrains depth AT the hand and the frozen
# encoder's relative depth is wrong elsewhere. Fix (Cyrus direction a): unfreeze
# a FEW transformer blocks + the Gaussian head and SUPERVISE gs_depth directly on
# the GT metric object depth (HOT3D meshes + 6-DoF poses), so the network has a
# real metric target on the objects, not just the hand. Re-run B2: if object
# depth drops below the 62cm baseline -> the scene becomes metric -> main-track.
# Differs from exp_p2_pinhole_unfreeze (full unfreeze, reconstruction-only, no
# direct depth signal) in the two things that matter: partial unfreeze + GT depth.
# ==================================================================
data:
  data_root: "/work/courses/3dv/team25/data/hot3d_aria/preprocessed_pinhole_f609"
  num_frames: 16
  resolution: [224, 224]
  clip_stride: 8
  val_split: 0.01
  num_workers: 4              # 12 forked workers over 16k clips spiked RAM to 61G; step is GPU-bound anyway
# ------------------------------------------------------------------
model:
  checkpoint: "models/NeoVerse/reconstructor.ckpt"
  warm_start_hand_head: "/work/courses/3dv/team25/checkpoints/default/hand_head_final.pt"
  freeze_backbone: true       # partial unfreeze below; heads train regardless
  enable_hand: true
  hand_head_type: "hamer"
  use_hand_crop: true
  hand_crop_size: 8
  enable_cam: true
  enable_pts: false
  enable_depth: false
  enable_norm: false
  enable_motion: false
  enable_gs: true
  hand_to_gs_injection:
    enabled: true
    use_hand_valid_mask: true
  hamer_head_kwargs:
    dim: 1024
    depth: 6
    heads: 8
    dim_head: 64
    mlp_dim: 1024
    dropout: 0.0
    crop_global_depth: 1
# ------------------------------------------------------------------
loss_weights:
  kp3d:          0.05
  kp3d_abs:      0.05
  kp2d:          0.05
  global_orient: 0.01
  hand_pose:     0.01
  betas:         0.01
  transl:        0.1
  gs_l1:         0.5          # keep reconstruction (don't lose the rendering gain)
  gs_lpips:      0.5
  hand_depth_anchor: 0.1      # gentle hand scale; the object term carries the metric signal
  obj_depth:     0.5          # <-- the direct GT metric-depth supervision on objects
# ------------------------------------------------------------------
hand_depth_anchor:
  margin: 0.02
  warmup_steps: 800
  depth_min: 0.01
  conf_thresh: 0.0
  direction: scene_follows_hand
obj_depth:
  objects_dir: "/work/scratch/dmonopoli/hot3d_assets"
  render_res: 224
  margin: 0.05                # smooth-L1 beta (m); tolerate object-thickness scatter
  depth_min: 0.01
  depth_max: 50.0
  warmup_steps: 400           # let the heads settle before the metric pull ramps in
metric_scale:
  enable: true
  clamp: [0.1, 10.0]
# ------------------------------------------------------------------
training:
  lr: 5e-6                    # low: protect the pretrained blocks we unfreeze
  min_lr: 1e-7
  epochs: 1
  batch_size: 2               # backprop through unfrozen blocks (memory)
  grad_accum_steps: 16        # effective batch ~32
  use_amp: true
  log_every: 25
  val_every: 50
  val_max_batches: 12
  save_every: 100
  grad_clip_norm: 5.0         # tight: unfreezing + strong depth loss is less stable
  kp3d_abs_warmup_steps: 200
  unfreeze_last_n_blocks: 4   # <-- "several layers": last 4 frame + 4 global blocks
  keep_last_checkpoints: 0
  seed: 42
  output_dir: "/work/scratch/dmonopoli/checkpoints/p3_gtdepth"  # 5-6GB/ckpt; keep off $HOME (quota)
# ------------------------------------------------------------------
visualization:
  mano_model_folder: "models/MANO"
  num_vis_frames: 4
# ------------------------------------------------------------------
hand_crop:
  rescale_factor: 1.5
# ------------------------------------------------------------------
debug:
  enabled: false
  max_sequences: 5
  single_frame: false
# ------------------------------------------------------------------
wandb:
  enabled: false
  project: "hand-head-training"
  entity: 3DV-Project
  run_name: "P3: partial unfreeze + GT object-depth supervision"
  tags: []
  notes: null
