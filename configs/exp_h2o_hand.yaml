# ==================================================================
# H2O hand fine-tune -> the competitive C-MPJPE (the Tier-1 gate).
# Fine-tune the hand head + last 4 blocks on H2O's clean MANO-fit joints; supervise
# the predicted camera-frame joints with abs + root-relative L2. GS head off.
# Zero-shot baseline was C-MPJPE 257mm; target is ~40-52mm (HaWoR/Hand3R).
# ==================================================================
data:
  data_root: "/work/scratch/dmonopoli/h2o_packed"
  num_frames: 16
  clip_stride: 8
  val_split: 0.2
  test_subject: "subject4"     # H2O standard cross-subject split (train 1-3, test 4)
  num_workers: 4
model:
  checkpoint: "models/NeoVerse/reconstructor.ckpt"
  warm_start_hand_head: "/work/courses/3dv/team25/checkpoints/default/hand_head_final.pt"
  freeze_backbone: true
  enable_hand: true
  hand_head_type: "hamer"
  use_hand_crop: true
  hand_crop_size: 8
  # High-res hand-crop encoder branch (the pose-resolution fix). Default false ->
  # the 224 px path is untouched. When true: pack with --hand_crop_px 256 first,
  # and the dataset returns native hand_crop_L/R fused into the HaMeR head.
  hires_hand: false
  hires_hand_kwargs:
    arch: "resnet18"
    pretrained: true
    crop_px: 256
  enable_cam: true
  enable_pts: false
  enable_depth: false
  enable_norm: false
  enable_motion: false
  enable_gs: false
  hand_to_gs_injection:
    enabled: false
  hamer_head_kwargs:
    dim: 1024
    depth: 6
    heads: 8
    dim_head: 64
    mlp_dim: 1024
    dropout: 0.0
    crop_global_depth: 1
training:
  lr: 1e-5
  epochs: 10
  batch_size: 2
  grad_accum_steps: 4
  use_amp: true
  log_every: 10
  val_every: 40
  val_max_batches: 40
  grad_clip_norm: 5.0
  unfreeze_last_n_blocks: 8
  w_abs: 1.0
  w_rr: 1.0
  output_dir: "/work/scratch/dmonopoli/checkpoints/h2o_hand"
visualization:
  mano_model_folder: "models/MANO"
hand_crop:
  rescale_factor: 1.5
