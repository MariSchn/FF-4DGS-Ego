# ==================================================================
# P3-WABS world-space EVAL config.
# ------------------------------------------------------------------
# Identical to exp_p3_wabs.yaml EXCEPT enable_gs: true. The world-space eval
# (scripts.eval_world_space) needs the GS renderer to produce
# rendered_extrinsics (per-clip cam->world) and gs_depth (metric-scale anchor);
# the training config keeps GS off for speed. Warm-starts the DEPLOYED hand head
# so this reproduces the eval crash without the ephemeral freshly-trained ckpt.
# To eval a freshly-trained head instead, point warm_start_hand_head at it.
# ==================================================================
data:
  data_root: "/work/courses/3dv/team25/data/hot3d_aria/preprocessed_pinhole_f609"
  num_frames: 16
  resolution: [224, 224]
  clip_stride: 8
  val_split: 0.01
  num_workers: 4
# ------------------------------------------------------------------
model:
  checkpoint: "models/NeoVerse/reconstructor.ckpt"
  warm_start_hand_head: "/work/courses/3dv/team25/checkpoints/default/hand_head_final.pt"
  freeze_backbone: true
  enable_scale_head: false
  enable_hand: true
  hand_head_type: "hamer"
  use_hand_crop: true
  hand_crop_size: 8
  enable_cam: true
  enable_pts: false
  enable_depth: false
  enable_norm: false
  enable_motion: false
  enable_gs: true             # ON for eval: world placement needs rendered_extrinsics + gs_depth
  hand_to_gs_injection:
    enabled: false
    use_hand_valid_mask: true
  hamer_head_kwargs:
    dim: 1024
    depth: 6
    heads: 8
    dim_head: 64
    mlp_dim: 1024
    dropout: 0.0
    crop_global_depth: 1
# ------------------------------------------------------------------
metric_scale:
  enable: true
  clamp: [0.1, 10.0]
# ------------------------------------------------------------------
visualization:
  mano_model_folder: "models/MANO"
  num_vis_frames: 4
# ------------------------------------------------------------------
hand_crop:
  rescale_factor: 1.5
