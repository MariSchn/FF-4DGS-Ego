# ==================================================================
# P2-warmstart: init from Marian's 50mm hand-head + abs-3D refinement.
# ------------------------------------------------------------------
# Starts from the converged 50.08mm hand head (hand_head_final.pt) and refines
# placement with the abs-3D loss at a GENTLE lr (1e-5) so the loss nudges the
# residual ~42mm placement gap instead of knocking the model off its optimum.
# Same 93-seq pinhole train set as the 50mm run -> clean "50mm -> 50mm+abs3d".
# ==================================================================
data:
  data_root: "/work/courses/3dv/team25/data/hot3d_aria/preprocessed_pinhole_f609"
  num_frames: 16
  resolution: [224, 224]
  clip_stride: 8
  val_split: 0.01
  num_workers: 4
# ------------------------------------------------------------------
model:
  checkpoint: "models/NeoVerse/reconstructor.ckpt"
  # Initialise the hand head from the 50mm run (not from scratch).
  warm_start_hand_head: "/work/courses/3dv/team25/checkpoints/default/hand_head_final.pt"
  freeze_backbone: true
  enable_hand: true
  hand_head_type: "hamer"
  use_hand_crop: true
  hand_crop_size: 8
  enable_cam: true
  enable_pts: false
  enable_depth: false
  enable_norm: false
  enable_motion: false
  enable_gs: true
  hand_to_gs_injection:
    enabled: true
    use_hand_valid_mask: true
  hamer_head_kwargs:
    dim: 1024
    depth: 6
    heads: 8
    dim_head: 64
    mlp_dim: 1024
    dropout: 0.0
    crop_global_depth: 1
# ------------------------------------------------------------------
loss_weights:
  kp3d:          0.05
  kp3d_abs:      0.0
  kp2d:          0.0    # DISABLED 2026-08-06: Aria-hardcoded (1408 px + 90deg rotation) vs unrotated res-pixel GT; see task #62
  global_orient: 0.01
  hand_pose:     0.01
  betas:         0.01
  transl:        0.1
  gs_l1:         0.1
  gs_lpips:      0.1
  hand_depth_anchor: 0.0
# ------------------------------------------------------------------
hand_depth_anchor:
  margin: 0.02
  warmup_steps: 800
  depth_min: 0.01
  conf_thresh: 0.0
  direction: scene_follows_hand
metric_scale:
  enable: true
  clamp: [0.1, 10.0]
# ------------------------------------------------------------------
training:
  lr: 1e-5               # gentle fine-tune from the converged 50mm head
  min_lr: 1e-7
  epochs: 1
  batch_size: 4
  grad_accum_steps: 8
  use_amp: true
  log_every: 50
  val_every: 50
  val_max_batches: 12
  save_every: 100
  grad_clip_norm: 10.0
  kp3d_abs_warmup_steps: 200
  keep_last_checkpoints: 0   # no numbered checkpoints; keep only best/latest/final (disk)
  seed: 42
  output_dir: "checkpoints/p2_control"
# ------------------------------------------------------------------
visualization:
  mano_model_folder: "models/MANO"
  num_vis_frames: 4
# ------------------------------------------------------------------
hand_crop:
  rescale_factor: 1.5
# ------------------------------------------------------------------
debug:
  enabled: false
  max_sequences: 5
  single_frame: false
# ------------------------------------------------------------------
wandb:
  enabled: true
  project: "hand-head-training"
  entity: 3DV-Project
  run_name: "P2 control: warm-start, NO abs3d/anchor (isolate coupling)"
  tags: []
  notes: null
